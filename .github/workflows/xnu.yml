name: xnu

on:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          runner label. macos-latest = macOS 26 (short queue), macos-15 = the
          macOS 15 image that is known to build this xnu with Xcode 16
        default: macos-latest
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (SAGIT = Xiaomi Mi 6 / msm8998)
        default: SAGIT
      keep_going:
        description: >-
          make -k: keep compiling after the first error. Off by default so a
          failure stops early instead of dumping tens of MB of warnings.
        default: "false"
      upload_buildtree:
        description: >-
          upload the patched source tree tarball (large, ~100 MB; only needed
          to replay a single compile command locally)
        default: "false"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SAGIT' }}

jobs:
  build:
    # macos-14 (and -large/-xlarge) were retired 2026-11-02; the supported
    # arm64 labels are macos-15 / macos-26 / macos-latest (= macos-26).
    # macos-15 builds this xnu today (macOS 15.8 + Xcode 16.0) but queues badly;
    # macos-latest is the short-queue fallback. Override per run with the
    # "runner" input instead of editing this file.
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # Copy our series over. Three rules, all learned the hard way:
          #  * skip any *-sweet-* patch still sitting in the fork -- otherwise
          #    both it and our *-sagit-* version apply, the second one wins, and
          #    the build reports "Unsupported CURRENT_MACHINE_CONFIG SAGIT".
          #  * clear any pre-existing NUMBERED file with the same prefix first,
          #    so a stale/same-numbered patch can never be applied twice.
          #  * only ever treat NNNN-* names as ours: dxb/patches also holds
          #    blacktop's own patches (skywalk*, synthetic*, ...) and those must
          #    be left alone.
          for f in xnu/patches/*.patch; do
            b=$(basename "$f")
            case "$b" in *-sweet-*) echo "ignoring stale $b"; continue;; esac
            case "$b" in
              [0-9][0-9][0-9][0-9]-*)
                n=$(printf '%s' "$b" | cut -c1-4)
                find dxb/patches -maxdepth 1 -name "${n}-*.patch" -delete 2>/dev/null || true
                ;;
            esac
            cp "$f" dxb/patches/
          done
          # Deliberately NOT copying *.sh: build.sh runs PATCH_DIR/*.sh *before*
          # applying patches, so a stale 0019-stage-libpthread.sh left in the
          # fork would clone and build libpthread for a stage that does not need
          # it. Stage 3 has no .sh helpers; add them back when we take 0019+.
          dup=$( (ls dxb/patches/*.patch 2>/dev/null || true) | xargs -n1 basename 2>/dev/null \
                 | grep -E '^[0-9]{4}-' | cut -c1-4 | sort | uniq -d || true)
          if [ -n "$dup" ]; then echo "::error::duplicate numbered patches: $dup"; exit 1; fi
          echo "our numbered patches:"
          for f in dxb/patches/[0-9][0-9][0-9][0-9]-*.patch; do
            [ -e "$f" ] && echo "  $(basename "$f")"
          done
          true
          # libfirehose_kernel is built arm64e-only; the SAGIT kernel is plain arm64 (Kryo 280, no PAC)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled)
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          echo "=== Xcode images present ==="
          ls -d /Applications/Xcode*.app || true

          # Prefer the toolchains this xnu is known to build with, in order:
          #   15.x  what sweet/ios-sweet used (iig matches the 8796 IORPC ABI)
          #   16.x  what actually produced our working sagit kernel
          # then whatever the image has, and let the build show us what breaks.
          pick() { ls -d /Applications/Xcode_$1*.app 2>/dev/null | sort -V | head -1; }
          XC=$(pick 15)
          [ -n "$XC" ] || XC=$(pick 16)
          if [ -n "$XC" ]; then
            echo "selected Xcode: $XC"
          else
            XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | head -1)
            [ -n "$XC" ] || XC=/Applications/Xcode.app
            echo "::warning title=no Xcode 15/16 on this image::using $XC -- iig/SDK may not match xnu-8796"
          fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK: $SDK ($(plutil -extract Version raw "$SDK/SDKSettings.plist" 2>/dev/null || echo '?'))"
          IIG=$(xcrun --find iig)
          echo "iig: $IIG"
          # dump the IORPC shape this iig assumes, so a failure is diagnosable
          grep -rl 'kernelContent' "$SDK" 2>/dev/null | head -5 || echo "no kernelContent in SDK (good sign)"

      - name: Build
        working-directory: dxb
        env:
          # -s silences make's recipe echo (that alone is tens of thousands of
          # lines); -k only when explicitly asked, since it makes a failed run
          # compile the rest of the tree and dump every warning.
          MAKEFLAGS: ${{ inputs.keep_going == 'true' && '-s -k' || '-s' }}
        run: |
          LOG="${RUNNER_TEMP}/build.log"
          rc=0
          bash build.sh >"$LOG" 2>&1 || rc=$?
          echo "build.sh exit code: $rc"
          echo "full compiler log: $(wc -l < "$LOG") lines, $(du -h "$LOG" | cut -f1) (not shown)"

          # Only diagnostics go into the job log and into the small artifact;
          # the raw log stays on the runner. Grep -A gives the source context
          # that a bare "error:" line loses.
          DIAG="${RUNNER_TEMP}/diagnostics.txt"
          {
            echo "# build.sh exit $rc"
            echo "# $(date -u +%FT%TZ)"
            echo
            if grep -qE 'XNU Build Done' "$LOG"; then echo "RESULT: SUCCESS"; else echo "RESULT: FAILURE"; fi
            echo
            echo "## error index"
            IDX=$(grep -nE 'error:|fatal error|Error [0-9]+|\*\*\* \[|undefined (symbol|reference)|static assertion|Unsupported' "$LOG" | head -40 || true)
            if [ -n "$IDX" ]; then echo "$IDX"; else echo "(no error-like lines in the build output)"; fi
            echo
            echo "## error context (first few, with source lines)"
            grep -B6 -A12 -m6 -E 'error:|fatal error|\*\*\* \[|undefined (symbol|reference)|static assertion|Unsupported' "$LOG" \
              | head -200 || true
            echo
            echo "## last 20 lines"
            tail -20 "$LOG"
          } > "$DIAG"
          echo "diagnostics: $(wc -l < "$DIAG") lines, $(wc -c < "$DIAG") bytes"
          cat "$DIAG"
          exit $rc

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: ${{ runner.temp }}/diagnostics.txt
          if-no-files-found: warn

      - name: Package build tree for local compiles
        # Off by default: the tarball is large and only useful for replaying a
        # single compile command locally. Enable with the upload_buildtree input.
        if: always() && inputs.upload_buildtree == 'true'
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always() && inputs.upload_buildtree == 'true'
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          # Newer images may ship no KDK at all; an unmatched glob would leave the
          # pattern literal and produce a file name containing '*' (upload-artifact
          # then errors on it), so skip when the file is not really there.
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            [ -e "$lib" ] || continue
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la /Library/Developer/KDKs 2>/dev/null || echo "no /Library/Developer/KDKs on this image"
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn


